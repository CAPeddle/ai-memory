services:
  db:
    build:
      context: .
      dockerfile: docker/postgres-age/Dockerfile
    environment:
      POSTGRES_DB: ai_memory
      POSTGRES_USER: ai_memory
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_memory -d ai_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai_memory:${DB_PASSWORD}@db:5432/ai_memory
      MEMORY_API_KEY: ${MEMORY_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Optional agent credential for /api/workflow (ST-086). This block enumerates
      # variables explicitly, so a value present in .env does NOT reach the container
      # unless it is named here — without this line the operator/agent split would
      # silently not apply on the Docker path and every agent-key request would 401.
      # `:-` defaults it to empty when unset, which the server treats as "no agent
      # key configured" (both the middleware and the collision guard test it for
      # truthiness), so leaving it out of .env keeps today's single-key behaviour.
      AWCP_AGENT_API_KEY: ${AWCP_AGENT_API_KEY:-}
      # Operator secret a remote execution node presents on its FIRST registration
      # (ST-088). Same explicit-enumeration reason as the line above — and the failure
      # mode here is quieter: unset means enrolment is CLOSED, so a hub missing this
      # answers 401 to every registration, which is indistinguishable from a wrong
      # bearer. `:-` keeps it optional, because a deployment running no nodes is
      # ordinary and must still boot. Generate with `openssl rand -hex 32`.
      AWCP_NODE_ENROLMENT_SECRET: ${AWCP_NODE_ENROLMENT_SECRET:-}
      # Mounts the workflow module's node-client surface for Phase 3 of ST-088
      # (`server/index.ts` mounts `/workflow/nodes/*` only inside
      # `if (workflowFeatureEnabled())`, and that predicate is exactly
      # `FEATURE_WORKFLOW === "true"`). Without this line, `POST
      # /workflow/nodes/register` answers 404 — the route is not mounted at
      # all — while `GET /health` still reports healthy either way, so a
      # health check cannot tell you whether this flag is on. Once mounted,
      # the same endpoint answers 401 for a missing/wrong bearer: **404 means
      # the routes are not mounted; 401 means they are mounted and refused
      # auth.** Hardcoded `"true"` (not `${FEATURE_WORKFLOW:-}`) because the
      # base `mcp` service is meant to have this always on for the remainder
      # of ST-088, unlike the optional credentials above.
      FEATURE_WORKFLOW: "true"
    # Dev bind mount: host ./server is the source of truth at runtime so that
    # /continue can write new files (tests, src) and `docker compose exec mcp deno ...`
    # sees them immediately without rebuilding the image. Production deployment
    # (ST-023) will use a no-mount variant.
    volumes:
      - ./server:/app
      - ./shared:/shared:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Test profile services (activated with: docker compose --profile test up -d) ---

  db-test:
    build:
      context: .
      dockerfile: docker/postgres-age/Dockerfile
    profiles: [test]
    environment:
      POSTGRES_DB: ai_memory
      POSTGRES_USER: ai_memory
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_memory -d ai_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    image: postgres:15
    profiles: [test]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./server/tests/fixtures/search-quality-corpus.sql:/seed/corpus.sql:ro
      # ST-092 R6: marks this database as a designated TEST database, which is what
      # the destructive suites check before dropping anything. It is applied FIRST and
      # with `-v ON_ERROR_STOP=1`, so a test stack whose marker failed to apply never
      # comes up pretending to be marked — the guard fails closed, and so does this.
      - ./server/db/test-database-marker.sql:/seed/test-database-marker.sql:ro
    entrypoint: ["/bin/sh", "-c", "until pg_isready -h db-test -U ai_memory -d ai_memory; do sleep 1; done && psql -v ON_ERROR_STOP=1 -h db-test -U ai_memory -d ai_memory -f /seed/test-database-marker.sql && psql -h db-test -U ai_memory -d ai_memory -f /seed/corpus.sql"]
    restart: "no"

  mcp-test:
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: [test]
    depends_on:
      db-test:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ai_memory:${DB_PASSWORD}@db-test:5432/ai_memory
      MEMORY_API_KEY: ${MEMORY_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Disable background LISTEN/NOTIFY auto-drain so integration tests
      # can call the consolidate MCP tool explicitly without races.
      CONSOLIDATION_WORKER_DISABLED: "true"
      # Disable the embedding backfill auto-sweep so the server process does not
      # race explicit runBackfillSweep() calls in tests against the shared db-test.
      EMBEDDING_BACKFILL_DISABLED: "true"
    volumes:
      - ./server:/app
      - ./shared:/shared:ro
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db_data:
