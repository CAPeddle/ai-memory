name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The server integration suite exercises LLM/embedding-dependent tests and
      # therefore genuinely requires OPENROUTER_API_KEY. This gate is an
      # intentional hard failure, but it is scoped to THIS job only. The sibling
      # contact-memory-tests job runs independently and needs no secret, so a
      # missing OPENROUTER_API_KEY reds only this job — it can no longer silently
      # red-X the whole pipeline for suites that don't need it (ST-069).
      - name: Require OPENROUTER_API_KEY secret
        run: |
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "Missing repository secret OPENROUTER_API_KEY — set it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Create .env for CI
        run: |
          cat <<EOF > .env
          MEMORY_API_KEY=ci-test-key
          DB_PASSWORD=ci-test-password
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: Start test infrastructure
        run: docker compose --profile test up -d --build --wait

      - name: Wait for mcp-test healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then
              echo "mcp-test is healthy"
              exit 0
            fi
            echo "Waiting for mcp-test... ($i/30)"
            sleep 2
          done
          echo "mcp-test did not become healthy"
          docker compose --profile test logs
          exit 1

      # --allow-run=deno is required by workflow-mvp-e2e.test.ts (ST-086), which starts
      # and restarts a REAL server process — the only way to observe that the
      # composition root applies workflow migrations at boot, that the process starts
      # with no provider credential, and that operational state survives a restart.
      # Narrowed to the `deno` binary (server/tests/_helpers/serverProcess.ts spawns
      # only `Deno.execPath()`) rather than a bare --allow-run, so this step does not
      # hand every test file in the suite unrestricted subprocess-spawn permission. The
      # grant is on this one step rather than an --ignore list of tests that do not
      # need it, because an exclusion list drifts silently as tests are added.
      - name: Run integration tests
        run: docker compose --profile test exec -T mcp-test deno test --frozen --allow-net --allow-env --allow-read --allow-run=deno tests/

      - name: Print logs on failure
        if: failure()
        run: docker compose --profile test logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  contact-memory-tests:
    # Independent of the server integration job and its OPENROUTER_API_KEY gate.
    # The contact-memory suite stubs the AgentRuntime/provider seam, so it needs
    # no secret and stays green even when the server-side secret is absent
    # (ST-069). Runs natively on Deno — no Docker test stack required.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.0.0"

      - name: Run contact-memory tests
        working-directory: contact-memory
        run: deno task test
